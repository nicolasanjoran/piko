# Example Piko server configuration with automatic TLS via Let's Encrypt.
#
# This configuration enables ACME/Let's Encrypt automatic certificate management
# with a unified port - both proxy and agent connections on the same port (443).
#
# How it works:
# - Requests to the upstream_domain are handled as agent WebSocket connections
# - Requests to any other domain are proxied to registered services
# - Certificates are obtained automatically via Let's Encrypt
#
# Prerequisites:
# 1. DNS records:
#    - upstream.example.com → your server (for agent connections)
#    - *.example.com or specific domains → your server (for services)
# 2. Port 80 accessible for HTTP-01 challenges (Let's Encrypt verification)
# 3. Port 443 accessible for HTTPS traffic
#
# Usage:
# 1. Update the upstream_domain and email with your actual values
# 2. Start the server: piko server --config.path piko-acme.yaml
# 3. Agents connect to wss://upstream.example.com/piko/v1/upstream/{endpoint}
# 4. Services are accessed via https://{endpoint} (e.g., https://api.example.com)

# Cluster configuration for multi-node setups
cluster:
  join:
    - piko-1
    - piko-2
    - piko-3

# ACME/Let's Encrypt configuration
acme:
  # Enable automatic TLS certificate management
  enabled: true
  
  # Contact email for Let's Encrypt notifications (required)
  email: "admin@example.com"
  
  # Domain for agent connections (required)
  # Agents connect here via WebSocket to register their endpoints
  upstream_domain: "upstream.example.com"
  
  # Combine proxy and upstream on a single port (recommended)
  # When enabled:
  # - Requests to upstream_domain → agent WebSocket connections
  # - Requests to any other domain → proxied to services
  unified_port: true
  
  # Directory to cache TLS certificates (default: .piko/certs)
  cache_dir: "/var/lib/piko/certs"
  
  # Use staging environment for testing (default: false)
  # Set to true when testing to avoid Let's Encrypt rate limits
  # staging: true
  
  # Port for HTTP-01 challenges (default: 80)
  http_challenge_port: 80

# Proxy server configuration
# With unified_port: true, this is the single entry point for everything
proxy:
  bind_addr: ":443"
  # advertise_addr is required if the server can't auto-detect a private IP
  # Set this to your server's public IP or hostname
  # advertise_addr: "your-server-ip:443"
  timeout: 30s
  access_log:
    level: info
  http:
    read_timeout: 10s
    read_header_timeout: 10s
    write_timeout: 10s
    idle_timeout: 5m
    max_header_bytes: 1048576

# Upstream config (ignored when unified_port is true, but kept for fallback)
upstream:
  bind_addr: ":8001"
  # advertise_addr: "your-server-ip:8001"

# Admin server (internal management, HTTP only)
admin:
  bind_addr: ":8002"
  # advertise_addr: "your-server-ip:8002"

# Logging configuration
log:
  level: info

# Grace period for graceful shutdown
grace_period: 1m
