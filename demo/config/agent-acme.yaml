# Example Piko agent configuration for connecting to an ACME-enabled server.
#
# This configuration demonstrates how to register with a full domain name.
# The server will automatically obtain a Let's Encrypt certificate for each
# domain that agents register.
#
# Usage:
# 1. Update the connect URL to point to your Piko server's upstream domain
# 2. Update the endpoint_id to your desired service domain
# 3. Update the addr to point to your local service
# 4. Make sure DNS for your endpoint_id domain points to the Piko server
# 5. Start the agent: piko agent --config.path agent-acme.yaml

# Connection configuration to the Piko server
connect:
  # Connect to the ACME-enabled upstream server via HTTPS
  url: "https://upstream.example.com:8001"
  timeout: 30s

# Listeners configuration
# Each listener registers an endpoint with the Piko server
listeners:
  # Register with a full domain name
  # Requests to https://api.mycompany.com will be routed to localhost:3000
  - endpoint_id: "api.mycompany.com"
    addr: "http://localhost:3000"
    protocol: http
    timeout: 30s
    access_log:
      level: info

  # Another service on a different domain
  # Requests to https://dashboard.mycompany.com will be routed to localhost:8080
  - endpoint_id: "dashboard.mycompany.com"
    addr: "http://localhost:8080"
    protocol: http
    timeout: 30s
    access_log:
      level: info

# Optional: Agent metrics server
server:
  enabled: false
  bind_addr: ":5000"

# Logging configuration
log:
  level: info

# Grace period for graceful shutdown
grace_period: 1m
