# Example Piko agent configuration for connecting to an ACME-enabled server.
#
# With unified_port enabled on the server:
# - Agents connect to the upstream_domain on port 443
# - Each agent registers with a full domain name as endpoint_id
# - Requests to that domain are automatically routed to the agent
#
# Prerequisites:
# 1. DNS records for your service domains must point to the Piko server
# 2. The server obtains Let's Encrypt certificates automatically
#
# Usage:
# 1. Update the connect URL to your server's upstream domain
# 2. Update endpoint_id to your service domain
# 3. Update addr to your local service
# 4. Start the agent: piko agent --config.path agent-acme.yaml

# Connection configuration
connect:
  # Connect to the upstream domain (same port as proxy with unified_port)
  url: "https://upstream.example.com"
  timeout: 30s

# Listeners - each registers a domain with the server
listeners:
  # Example: Register api.example.com
  # Requests to https://api.example.com will be routed here
  - endpoint_id: "api.example.com"
    addr: "http://localhost:3000"
    protocol: http
    timeout: 30s
    access_log:
      level: info

  # Example: Register dashboard.example.com
  # Requests to https://dashboard.example.com will be routed here
  - endpoint_id: "dashboard.example.com"
    addr: "http://localhost:8080"
    protocol: http
    timeout: 30s
    access_log:
      level: info

# Optional: Agent metrics server
server:
  enabled: false
  bind_addr: ":5000"

# Logging
log:
  level: info

# Grace period
grace_period: 1m
